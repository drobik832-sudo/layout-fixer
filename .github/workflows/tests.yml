name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # evdev и PyGObject в PyPI собираются из исходников и требуют заголовков.
      # В Ubuntu они уже есть готовыми пакетами для системного python3,
      # поэтому venv создаётся с --system-site-packages — как в README.
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-evdev python3-gi gir1.2-glib-2.0 hunspell-ru hunspell-en-us

      - name: Окружение
        run: |
          python3 -m venv --system-site-packages .venv
          # В Python 3.12 venv создаётся без setuptools, а --no-build-isolation
          # запрещает pip скачать его самому. Ставим явно.
          .venv/bin/pip install -U pip setuptools wheel
          .venv/bin/pip install -e . --no-build-isolation

      # Тестам не нужны ни X-сервер, ни /dev/uinput: make_daemon подменяет
      # чтение раскладки. Поэтому тесты идут на голом раннере.
      - name: Тесты
        run: .venv/bin/python -m unittest discover -s tests -v
