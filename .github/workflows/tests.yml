name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # evdev и PyGObject есть в Ubuntu готовыми пакетами для системного
      # python3, а в PyPI собираются из исходников и требуют заголовков.
      # Поэтому НЕ используем actions/setup-python: он подставляет свой
      # python из toolcache, чей site-packages пуст, и --system-site-packages
      # тогда ничего не даёт. Работаем системным /usr/bin/python3 (3.12).
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv python3-setuptools python3-pip \
            python3-evdev python3-gi gir1.2-glib-2.0 \
            gsettings-desktop-schemas \
            hunspell hunspell-ru hunspell-en-us

      - name: Окружение
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          # В Python 3.12 venv создаётся без setuptools, а --no-build-isolation
          # запрещает pip скачать его самому. Ставим явно.
          .venv/bin/pip install -U pip setuptools wheel
          .venv/bin/pip install -e . --no-build-isolation

      - name: Проверка зависимостей
        run: |
          .venv/bin/python -c "import evdev, gi; print('evdev', evdev.__file__); print('gi ok')"

      # Тестам не нужны ни X-сервер, ни /dev/uinput: make_daemon подменяет
      # чтение раскладки. Поэтому тесты идут на голом раннере.
      - name: Тесты
        run: .venv/bin/python -m unittest discover -s tests -v
